[package]
name = "chatatui"
version = "0.1.0"
description = "A minimal terminal chat client for local LLMs (OpenAI-compatible API)"
authors = ["Damien <dap@csmrouen.com>"]
license = "MIT"
repository = "https://github.com/Golden76z/chatatui"
readme = "README.md"
keywords = ["tui", "llm", "ollama", "chat", "rag"]
categories = ["command-line-utilities"]
edition = "2024"
rust-version = "1.88"

[dependencies]
async-trait = "0.1"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream", "osc52"] }
directories = "6.0.0"
futures = "0.3.32"
ignore = "0.4.33"
pdf-extract = "0.12.1"
quick-xml = "0.42.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.2"
ratatui-textarea = "0.9.2"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-fancy"] }
thiserror = "2.0"
# Pinned to the 0.22 line on purpose: `candle-core` 0.11 already declares a non-optional
# `tokenizers = "0.22"` with `features = ["onig"]` for every non-wasm target, so this
# requirement unifies with the copy already in the tree and adds no crate to the build.
# The 1.0.0-rc line cannot be used: it removed `Tokenizer::new`, the component setters and
# `BpeBuilder::vocab_and_merges`, leaving only a read-only tokenizer loaded from a
# `tokenizer.json` — the companion file this milestone exists to do without.
tokenizers = { version = "0.22", default-features = false }
tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7"
toml = "0.9"
unicode-width = "0.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
notify = "8"
notify-debouncer-mini = "0.7.0"
base64 = "0.22"

[dev-dependencies]
insta = "1.48.0"
tempfile = "3"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
#
# `opt-level = "s"` looks wrong next to an inference engine, and raising it is not the lever.
# candle picks its quantized kernels with `#[cfg(target_feature = "avx2")]`, so what decides
# the engine's speed on x86_64 is the target CPU, not the optimisation level — see the
# `target-cpu=x86-64-v3` flags in `.github/workflows/release.yml` and the build note in the
# README. Measured difference on one machine: 0.13 token/s against several.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
