[package]
name = "chatatui"
version = "0.1.0"
description = "A minimal terminal chat client for local LLMs (OpenAI-compatible API)"
authors = ["Damien <dap@csmrouen.com>"]
license = "MIT"
edition = "2024"
rust-version = "1.88"

[dependencies]
async-trait = "0.1"
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream", "osc52"] }
directories = "6.0.0"
futures = "0.3.32"
ignore = "0.4.33"
pdf-extract = "0.12.1"
quick-xml = "0.42.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.2"
ratatui-textarea = "0.9.2"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-fancy"] }
thiserror = "2.0"
tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7"
toml = "0.9"
unicode-width = "0.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
insta = "1.48.0"
tempfile = "3"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
